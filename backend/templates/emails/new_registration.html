<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>New Registration</title>
  </head>
  <body
    style="font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px"
  >
    <div
      style="
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 8px;
        padding: 30px;
        border: 1px solid #e0e0e0;
      "
    >
      <h2 style="color: #111; margin-top: 0">
        New Registration - Chuttee Film Production
      </h2>
      <p style="color: #555">A new user has just registered on the platform.</p>
      <table
        cellpadding="8"
        cellspacing="0"
        border="0"
        style="
          width: 100%;
          border-collapse: collapse;
          font-size: 14px;
          margin: 20px 0;
        "
      >
        <tr>
          <td style="background: #f9f9f9; width: 140px"><b>Username</b></td>
          <td>{{ username }}</td>
        </tr>
        <tr>
          <td style="background: #f9f9f9"><b>Email</b></td>
          <td><a href="mailto:{{ email }}">{{ email }}</a></td>
        </tr>
        <tr>
          <td style="background: #f9f9f9"><b>Full name</b></td>
          <td>{{ full_name }}</td>
        </tr>
        <tr>
          <td style="background: #f9f9f9"><b>Phone</b></td>
          <td>{{ phone }}</td>
        </tr>
        <tr>
          <td style="background: #f9f9f9"><b>Role</b></td>
          <td>{{ role }}</td>
        </tr>
        <tr>
          <td style="background: #f9f9f9"><b>Joined</b></td>
          <td>{{ date_joined }}</td>
        </tr>
      </table>
      <p>
        <a
          href="{{ admin_url }}"
          style="
            background: #007bff;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            display: inline-block;
          "
          >View in Django Admin</a
        >
      </p>
      <hr style="border: none; border-top: 1px solid #eee; margin: 25px 0" />
      <p style="color: #999; font-size: 12px">
        Automated notification from CHUTTEE FILM PRODUCTION.
      </p>
    </div>
  </body>
</html>
