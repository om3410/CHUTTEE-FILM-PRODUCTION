<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Welcome</title>
  </head>
  <body
    style="font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px"
  >
    <div
      style="
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 8px;
        padding: 30px;
        border: 1px solid #e0e0e0;
      "
    >
      <h2 style="color: #111; margin-top: 0">Welcome, {{ first_name }}!</h2>
      <p style="color: #555">
        Your account on <b>Chuttee Film Production</b> has been created.
      </p>
      <p style="color: #555">
        You can now log in and start using the platform.
      </p>
      <p>
        <a
          href="{{ login_url }}"
          style="
            background: #28a745;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            display: inline-block;
          "
          >Log in to your account</a
        >
      </p>
      <hr style="border: none; border-top: 1px solid #eee; margin: 25px 0" />
      <p style="color: #999; font-size: 12px">- Team Chuttee Film Production</p>
    </div>
  </body>
</html>
