<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuttee Production · Home</title>
  <style>
    :root {
      --bg-1: #0f0c29;
      --bg-2: #302b63;
      --bg-3: #24243e;
      --accent: #f4a261;
      --accent-2: #e76f51;
      --text: #f5f5f5;
      --muted: #b8b8c8;
      --card: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-1));
      background-size: 400% 400%;
      animation: gradientShift 18s ease infinite;
      overflow-x: hidden;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Animated film grain overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 3px 3px;
      pointer-events: none;
      animation: grain 0.8s steps(2) infinite;
      opacity: 0.5;
    }

    @keyframes grain {
      0%   { transform: translate(0, 0); }
      50%  { transform: translate(-1px, 1px); }
      100% { transform: translate(0, 0); }
    }

    /* Floating orbs in background */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float 14s ease-in-out infinite;
      pointer-events: none;
    }
    .orb-1 { width: 380px; height: 380px; background: #f4a261; top: -120px; left: -100px; }
    .orb-2 { width: 300px; height: 300px; background: #e76f51; bottom: -80px; right: -80px; animation-delay: 3s; }
    .orb-3 { width: 250px; height: 250px; background: #6a4c93; top: 40%; left: 60%; animation-delay: 6s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(30px, -40px) scale(1.1); }
    }

    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    /* Film reel logo */
    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f4a261, #e76f51);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      margin-bottom: 24px;
      box-shadow: 0 0 40px rgba(244,162,97,0.45);
      animation: spin 12s linear infinite, pop 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pop {
      0%   { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #f4a261, #e76f51, #f4a261);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite, fadeUp 0.8s 0.2s both;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tagline {
      font-size: 1.15rem;
      color: var(--muted);
      margin-bottom: 40px;
      animation: fadeUp 0.8s 0.4s both;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 40px;
      max-width: 480px;
      width: 100%;
      animation: fadeUp 0.8s 0.6s both;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .welcome {
      font-size: 1.05rem;
      margin-bottom: 24px;
      color: var(--muted);
    }

    .welcome strong {
      color: var(--accent);
      font-weight: 600;
    }

    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.25) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.6s;
    }

    .btn:hover::after { transform: translateX(100%); }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #1a1a1a;
      box-shadow: 0 8px 24px rgba(244,162,97,0.4);
    }
    .btn-primary:hover { box-shadow: 0 12px 32px rgba(244,162,97,0.55); }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); border-color: var(--accent); }

    .api-links {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--muted);
    }
    .api-links a {
      color: var(--accent);
      text-decoration: none;
      margin: 0 8px;
      transition: color 0.2s;
    }
    .api-links a:hover { color: var(--accent-2); text-decoration: underline; }

    @media (max-width: 480px) {
      .card { padding: 28px 22px; }
      .logo { width: 72px; height: 72px; font-size: 34px; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="container">
    <div class="logo">🎬</div>
    <h1>Chuttee Production</h1>
    <p class="tagline">Where stories come alive, one frame at a time.</p>

    <div class="card">
      {% if user.is_authenticated %}
        <p class="welcome">Welcome back, <strong>{{ user.username }}</strong> 👋</p>
        <div class="btn-row">
          <a href="/api/production/projects/" class="btn btn-primary">View Projects API</a>
          <a href="/swagger/" class="btn btn-ghost">Open API Docs</a>
          <a href="{% url 'logout' %}" class="btn btn-ghost">Logout</a>
        </div>
      {% else %}
        <p class="welcome">Sign in to continue to your film dashboard.</p>
        <div class="btn-row">
          <a href="{% url 'login' %}" class="btn btn-primary">Login</a>
          <a href="{% url 'register' %}" class="btn btn-ghost">Create Account</a>
        </div>
      {% endif %}

      <div class="api-links">
        <a href="/swagger/">Swagger</a>·
        <a href="/redoc/">ReDoc</a>·
        <a href="/admin/">Admin</a>
      </div>
    </div>
  </div>
</body>
</html>
